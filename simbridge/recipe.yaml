context:
  name: simbridge
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: .

build:
  number: 0
  script: |
    if [ -f "$PREFIX/share/ros_workspace/local_setup.sh" ]; then source "$PREFIX/share/ros_workspace/local_setup.sh"; fi
    if [ -f "$PREFIX/share/ament_cmake/local_setup.sh" ]; then source "$PREFIX/share/ament_cmake/local_setup.sh"; fi
    mkdir -p build
    cd build
    export PYTHONHOME="$PREFIX"
    cmake ${CMAKE_ARGS} -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DPYTHON_EXECUTABLE=$PREFIX/bin/python3 -DPython3_EXECUTABLE=$PREFIX/bin/python3 ..
    cmake --build . --config Release
    cmake --install . --config Release
    if [ -f compile_commands.json ]; then cp compile_commands.json "$RECIPE_DIR/"; fi


requirements:
  build:
    - cmake >=3.20
    - ${{ compiler('cxx') }}
    - ros-humble-ament-cmake
    - ros-humble-rosidl-default-generators
  host:
    - nlohmann_json
    - ros-humble-rosidl-default-runtime
    - ros-humble-rclcpp
    - ros-humble-sensor-msgs
    - msgpack-cxx
    - libboost-devel          # ← ADD (or libboost-headers)
    - libuuid
  run:
    - nlohmann_json
    - ros-humble-rosidl-default-runtime
    - ros-humble-rclcpp
    - ros-humble-sensor-msgs
    - msgpack-cxx
    - libboost                # ← ADD
    - libuuid

about:
  summary: SPQR Booster SDK with ROS2 interface and locomotion control
  license: MIT
